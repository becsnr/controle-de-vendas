<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silk Vendas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <main class="dashboard">
        <!-- SIDEBAR -->
         <aside class="sidebar">
            <a href="index.html">inicio</a>

            <a href="">nova venda</a>

            <a href="">lista de vendas</a>

            <a href="">relatórios</a>

            <a href="">dark/light</a>
         </aside>

         <section class="content">
            <header class="topbar">
                <h1>Dashboard</h1>
            </header>

            <!-- CARDS -->
            <section class="cards">
                <div class="card">
                    <h3>Faturamento do dia</h3>
                    <strong>R$</strong>
                    <p>% vs ontem</p>
                </div>

                <div class="card">
                    <h3>Quantidade de Vendas</h3>
                    <strong>R$</strong>
                    <p>% vs ontem</p>
                </div>

                <div class="card">
                    <h3>Faturamento do Mês</h3>
                    <strong>R$</strong>
                    <p>% vs ontem</p>
                </div>

                <div class="card">
                    <h3>Ticket Médio</h3>
                    <strong>R$</strong>
                    <p>% vs ontem</p>
                </div>
            </section>

            <!-- GRÁFICOS -->
            <section class="charts">
                <div class="chart">
                    <h2>Faturamento últimos 7 dias</h2>
                </div>

                <div class="chart">
                    <h2>Faturamento do mês</h2>
                </div>
            </section>
         </section>
    </main>
</body>
</html>
