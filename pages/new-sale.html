<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silk Vendas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" href="../styles/geral.css">
    <link rel="stylesheet" href="../styles/new-sale.css">
</head>
<body>
    <main>
        <div class="overlay"></div>
         
         <!-- SIDEBAR -->
         <aside class="sidebar">
            <!-- BOTÃO DE FECHAR MENU -->
            <button class="close-btn">
                <span class="material-symbols-outlined">
                    close
                </span>
            </button>

            <a href="../index.html"> 
                <span class="material-symbols-outlined">
                    home
                </span> 
                Dashboard
            </a>

            <a href="new-sale.html" class="active"> 
                <span class="material-symbols-outlined">
                    shopping_cart
                </span> 
                Nova Venda
            </a>

            <a href="sales-list.html"> 
                <span class="material-symbols-outlined">
                    list
                </span> 
                Lista de Vendas
            </a>

            <a href=""> 
                <span class="material-symbols-outlined">
                    analytics
                </span> 
                Relatórios
            </a>

            <a href=""> 
                <span class="material-symbols-outlined">
                    dark_mode
                </span> 
                Dark/Light
            </a>
         </aside>

         <section class="content">
            <header class="topbar">
                <h1>Nova Venda</h1>

                <!-- BOTÃO MENU HAMBURGUER -->
                <button class="menu-btn">
                    <span class="material-symbols-outlined">
                        menu
                    </span>
                </button>
            </header>

            <section class="form">
                <form action="" method="post">
                    <div class="input-group">
                        <label for="produto">Produto/Serviço</label>
                        <select name="produto" id="produto">
                            <option value="" disabled selected hidden>Selecione um produto</option>
                            <option value="p1">produto 1</option>
                            <option value="p2">produto 2</option>
                            <option value="p3">produto 3</option>
                            <option value="p4">produto 4</option>
                        </select>
                    </div>

                    <div class="double-line">
                        <div class="input-group">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" name="quantidade" id="quantidade" min="1" value="1" required>
                        </div>
                        <div class="input-group">
                            <label for="valor">Valor (R$)</label>
                            <input type="text" name="valor" id="valor" inputmode="numeric" min="0" placeholder="0,00" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="pagamento">Forma de Pagamento</label>
                        <select name="pagamento" id="pagamento" required>
                            <option value="" disabled selected hidden>Selecione a forma de pagamento</option>
                            <option value="pix">Pix</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="debito">Cartão de Débito</option>
                            <option value="credito">Cartão de Crédito</option>
                        </select>
                    </div>

                    <div class="total-box">
                        <span class="total-title">Total da Venda</span>
                        <span class="total-value">R$ 0,00</span>
                    </div>

                    <div class="btns">
                        <button type="reset" class="btn-clear"> Limpar</button>
                        <button type="submit" class="btn-submit">Registrar Venda</button>
                    </div>
                </form>
            </section>
         </section>
    </main>

    <script src="../js/ui/menu.js"></script>
    <script src="../js/ui/value.js"></script>
</body>
</html>
